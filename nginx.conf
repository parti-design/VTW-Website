# Serving a static build. No application, no upstream, no runtime templating.
# Behaves like GitHub Pages did for this site, so every old URL answers the same way.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;

  # Redirects are built from the request, not from nginx's idea of its own hostname,
  # which behind Cloudflare is the container. Without this the /about -> /about/
  # redirect would point at http://localhost/about/.
  absolute_redirect off;

  # Cloudflare sits in front, so the client IP arrives in a header.
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript text/javascript application/json
             image/svg+xml application/xml text/xml application/rss+xml application/atom+xml;

  # ── Caching ──────────────────────────────────────────────────────────────────
  # Astro fingerprints what it emits into _astro, so those are immutable.
  location ^~ /_astro/ {
    include /etc/nginx/conf.d/security-headers.inc;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Photographs keep their names but are not fingerprinted: one could be replaced
  # under the same name, so a week rather than a year.
  location ^~ /assets/images/ {
    include /etc/nginx/conf.d/security-headers.inc;
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location ~* \.(?:ico|woff2?)$ {
    include /etc/nginx/conf.d/security-headers.inc;
    expires 30d;
    add_header Cache-Control "public";
  }

  # The feed and the sitemap, as application/xml like GitHub Pages sent them (nginx's
  # own table says text/xml).
  location ~ \.xml$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    types { }
    default_type "application/xml; charset=utf-8";
    try_files $uri =404;
  }

  # HTML, and the CSS, which is not fingerprinted: cheap to revalidate, and a deploy
  # has to show at once (the visual editor waits for it).
  location / {
    # add_header does not inherit into a block that declares its own, so the
    # security headers are included in every location that sets one.
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    # $uri/ answers /about with a 301 to /about/, as GitHub Pages did: every page URL on
    # this site ends in a slash, and the redirect keeps one address per page.
    try_files $uri $uri/ =404;
  }

  # A folder without an index.html (/assets/images/) is a 404, not a 403, as before.
  error_page 403 =404 /404.html;
  error_page 404 /404.html;
}
